<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Chaithu5 security engineer profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1100" height="220" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1098" height="218" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="1098" height="4" rx="2" fill="url(#accent)"/>

  <!-- radar / shield motif -->
  <g transform="translate(930,110)" opacity="0.9" filter="url(#glow)">
    <circle r="58" fill="none" stroke="#1E293B" stroke-width="10"/>
    <circle r="58" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="38" fill="none" stroke="#0EA5E9" stroke-width="1.2" opacity="0.7"/>
    <circle r="18" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <circle r="3.5" fill="#34D399"/>
    <path d="M0 0 L48 -18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-22,-8 C-10,-32 10,-32 22,-8 L14,20 C6,28 -6,28 -14,20 Z" fill="none" stroke="#34D399" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="1100" height="18" fill="url(#scan)" opacity="0.55">
    <animate attributeName="y" values="0;202;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#64748B">~/security</text>
  <text x="48" y="122" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC">Chaithu anv</text>
  <text x="48" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#94A3B8">Security Engineer  ·  AppSec  ·  Cloud  ·  DevSecOps  ·  Threat Intel</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <rect x="48" y="176" width="86" height="24" rx="6" fill="#0EA5E9" fill-opacity="0.15" stroke="#0EA5E9" stroke-opacity="0.45"/>
    <text x="61" y="192" fill="#7DD3FC">OMS · 2026</text>
    <rect x="146" y="176" width="92" height="24" rx="6" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="158" y="192" fill="#6EE7B7">PNPT · WIP</text>
    <rect x="250" y="176" width="118" height="24" rx="6" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="262" y="192" fill="#C4B5FD">AI × Security</text>
  </g>
</svg>
